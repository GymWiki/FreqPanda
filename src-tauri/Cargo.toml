[package]
name = "freqtrade-command-center"
version = "0.1.17"
description = "Freqtrade Command Center desktop app — local FreqAI training shell around the web dashboard"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-fs = "2"
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "fs", "rt-multi-thread", "macros"] }
# Only used to fetch the official Docker Desktop installer when Docker isn't
# found on the user's machine (see ensure_docker_ready in src/main.rs) —
# rustls-tls to match the pure-Rust TLS stack tauri-plugin-updater already
# pulls in, no system OpenSSL dependency needed on either platform.
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
# Only used to compute the --timerange passed to download-data/backtesting
# (see train_local_model in src/main.rs) — already an existing transitive
# dependency (pulled in by tauri-plugin-updater), promoted to direct here.
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
